
name: DigiTools Store Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build User App
        run: npm run build

      - name: Upload Build Files
        uses: actions/upload-artifact@v4
        with:
          name: DigiTools-Website
          path: dist/
